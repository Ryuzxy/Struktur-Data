{% extends "layout.html" %}

{% block title %}Page Not Found - BroderPro{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="mb-4">
                <i class="bi bi-exclamation-triangle" style="font-size: 4rem; color: #dc3545;"></i>
            </div>
            
            <h1 class="display-1 fw-bold mb-3">404</h1>
            <h2 class="mb-3">Page Not Found</h2>
            
            <p class="text-muted mb-4">
                Sorry, the page you're looking for doesn't exist.
            </p>
            
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                <i class="bi bi-house"></i> Go to Home
            </a>
            <a href="{{ url_for('reservations.index') }}" class="btn btn-outline-primary btn-lg">
                <i class="bi bi-calendar"></i> Go to Reservations
            </a>
        </div>
    </div>
</div>
{% endblock %}
